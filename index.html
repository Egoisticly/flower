.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:1px 0 3px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;white-space:nowrap;background:transparent;color:var(--fg);border:1.5px solid var(--muted);padding:8px 13px;font-size:13px}
.chip:hover:not(:disabled){border-color:var(--water)}
.chip:active:not(:disabled){transform:scale(.96)}

.chip[aria-pressed="true"]{border-color:var(--water);background:color-mix(in srgb,var(--water) 20%,transparent)}
.row,.dur{display:flex;align-items:center;gap:8px}

.setup,.wbox{display:flex;flex-direction:column;gap:7px}
.remind{display:flex;align-items:center;gap:10px;border:1.5px solid var(--water);border-radius:14px;padding:8px 10px}
.remind .small{flex:1;font-size:12.5px;line-height:1.3;color:var(--fg)}
.lk{flex:none;background:var(--btn);color:var(--btnfg);border-radius:99px;padding:8px 13px;font:600 13px 'Figtree',system-ui,sans-serif;text-decoration:none;text-align:center}
.sheet{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:10}

.st{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.35}}
.cl{animation:drift 60s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(45px)}}
@media (prefers-reduced-motion:reduce){.st,.cl{animation:none}}
</style>

    var f={t:q[0],x:q[1],y:q[2],c:q[3],m:q[4],n:q[6],th:q[7],d:q[1]<200?-1:1,r:0},R=34*q[5];
    f.stem=mk('path',{},stems);
    f.g=mk('g',{},heads);
    f.o=[];f.i=[];
    BLD[f.t](f,R);
    f.bud=mk('circle',{r:R*.3,fill:'#3f9a5c'},f.g);
    f.b=0;f.R=R;
    return f;
  });
}

function stepBF(dt){
  var bt=done?T-doneT-1.2:-1;
  bfs.forEach(function(b,i){
    if(bt<i*.9)return;
    if(!b.on){b.on=1;b.x=i%2?-25:425;b.y=80+i*60;b.vx=i%2?60:-60;b.vy=0;b.mode='fly';b.tf=pick(cfg);b.ox=(Math.random()-.5)*16;b.oy=-b.tf.R*.3-Math.random()*6;b.ang=0;b.g.setAttribute('opacity',1)}
    b.ph+=dt;
    var f=b.tf,tx=f.hx+b.ox,ty=f.hy+b.oy,ang=b.ang,fl;
    if(b.mode==='rest'){
      b.x=tx;b.y=ty;b.rt-=dt;fl=.55+.45*Math.cos(T*3.5+i);ang*=.9;
      if(b.rt<=0){b.mode='fly';var nf=pick(cfg);b.tf=nf;b.ox=(Math.random()-.5)*16;b.oy=-nf.R*.3-Math.random()*6}
    }else{
      var dx=tx-b.x,dy=ty-b.y,dd=Math.hypot(dx,dy)||1,sp=Math.min(110,40+dd*.9),k=Math.min(1,dd/80),wob=Math.sin(b.ph*2.3+i*2)*45*k;
      b.vx+=((dx/dd)*sp+(-dy/dd)*wob-b.vx)*Math.min(1,dt*2.5);
      b.vy+=((dy/dd)*sp+(dx/dd)*wob-b.vy)*Math.min(1,dt*2.5);
      b.x+=b.vx*dt;b.y+=b.vy*dt;
      ang=Math.atan2(b.vx,-b.vy)*57.3;
      fl=Math.abs(Math.cos(T*20+i*2))*.85+.15;
      if(dd<7){b.mode='rest';b.rt=1.6+Math.random()*2.4}
    }
    b.ang=ang;
    b.g.setAttribute('transform','translate('+b.x+' '+b.y+') rotate('+ang+') scale(.9)');
    b.wr.setAttribute('transform','scale('+fl+' 1)');b.wl.setAttribute('transform','scale('+(-fl)+' 1)');
  });
}
